[package]
name = "media"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
core = { path = "../core" }
serde = { workspace = true }
serde_json.workspace = true
skia-safe = "0.88.0"

[target.'cfg(target_os = "macos")'.dependencies]
screencapturekit = { version = "1.5", features = ["macos_15_0"] }
whisper-rs = { version = "0.16.0", features = ["metal"] }

[target.'cfg(not(target_os = "macos"))'.dependencies]
whisper-rs = { version = "0.16.0" }

[target.'cfg(target_os = "linux")'.dependencies]
ashpd = { version = "0.11", default-features = false, features = ["tokio"] }
libc = "0.2"
tokio = { version = "1", features = ["rt", "time", "net", "sync"] }

[[bin]]
name = "doctor"
path = "src/bin/doctor.rs"
